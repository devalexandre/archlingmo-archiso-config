---
# Runs on the host against the target (${ROOT}) before initcpiocfg/initcpio: the
# unpacked squashfs still carries the live ISO's boot and login setup.
dontChroot: true
timeout: 30
script:
    # archiso's initramfs preset and hooks can't boot an installed system
    - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - command: "printf '%s\\n' \"ALL_kver='/boot/vmlinuz-linux'\" \"PRESETS=('default' 'fallback')\" \"default_image='/boot/initramfs-linux.img'\" \"fallback_image='/boot/initramfs-linux-fallback.img'\" \"fallback_options='-S autodetect'\" > ${ROOT}/etc/mkinitcpio.d/linux.preset"
    # Live session autologins
    - "rm -f ${ROOT}/etc/sddm.conf.d/autologin.conf"
    - "rm -rf ${ROOT}/etc/systemd/system/getty@tty1.service.d"
