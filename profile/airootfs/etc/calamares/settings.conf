---

modules-search: [ local ]

# Second shellprocess instance: strips the live-only setup before the initramfs is built
instances:
- id: cleanlive
  module: shellprocess
  config: shellprocess_cleanlive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - shellprocess@cleanlive
  - initcpiocfg
  - initcpio
  - removeuser
  - shellprocess
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - grubcfg
  - bootloader
  - umount
- show:
  - finished


branding: archlingmo

prompt-install: false

dont-chroot: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
